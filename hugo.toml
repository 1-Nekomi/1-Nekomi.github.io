baseURL = 'https://1-Nekomi.github.io'
canonifyURLs = true
locale = 'zh-CN'
title = 'Random Play'
theme = 'hugo-theme-reimu'

defaultContentLanguage = 'zh-CN'
[languages]
[languages.en]
label = 'English'
weight = 1
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true
[languages.zh-TW]
label = '繁體中文'
weight = 1
hasCJKLanguage = true
[languages.ja]
label = '日本語'
weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
home = ["Algolia", "HTML"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true